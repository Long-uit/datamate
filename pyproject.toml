[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate"
version = "0.1.0"
description = "DataMate - Production Pipeline for Zalo AI Challenge 2026"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "reports/Agents"]
pythonpath = [".", "src"]


